  function presentClassChoices(){
    CLASSES.forEach(c=>{
      log(`${c.name} — ${c.tagline}`,'sys');
      log(`HP ${c.hp} | Estresse ${c.stress} | Armadura ${c.armor} | Melee +${c.melee} | Hack +${c.hack} | Ranged +${c.ranged} | Perk: ${c.perk} (${c.perkDesc})`,'dim');
    });
    presentChoices(CLASSES.map(c=>({ label:`Selecionar ${c.name}`, cmd:`classe ${c.key}` })));
  }

  function chooseClass(key){
    const c = CLASSES.find(cl=>cl.key===key);
    if(!c) return;
    state.className = c.name; state.perkKey = c.key; state.perk = c.perk; state.perkDesc = c.perkDesc;
    state.hp = c.hp; state.maxHp = c.hp; state.stress = c.stress; state.maxStress = c.stress; state.armor = c.armor; state.baseArmor = c.armor;
    state.melee = c.melee; state.hack = c.hack; state.ranged = c.ranged; state.ap = c.ap; state.maxAp = c.ap; state.credits = c.credits + rand(0,3);
    state.gear = c.gear.slice();
    state.inventory = c.items.map(it=>({ id:it.id, qty:it.qty }));
    state.mode = 'hub'; state.x = 0; state.y = 0;
    log(`\nOperativo carregado: ${c.name}.`,'good');
    log(`Perk ativo: ${c.perk} — ${c.perkDesc}`,'dim');
    log('Contrato de Morrow: recupere o Chip Omega, liberte o runner capturado no Datavault Omega e extraia a matriz de dados do Núcleo K-9. Depois, volte ao Refúgio Neon e extraia.','warn');
    enterRoom();
    renderAll();
    presentContextChoices();
  }

  function resetGame(){
    state = freshState();
    screen.innerHTML = '';
    activeChoiceButtons = [];
    closeDrawer();
    intro();
    renderAll();
    cmdInput.value = '';
    cmdInput.focus();
  }

  /* ============================ DISPATCHER ============================ */
  function runCommand(raw){
    const input = (raw||'').trim();
    if(!input) return;
    log(`> ${input}`, 'dim');

    const lower = input.toLowerCase();
    const parts = lower.split(/\s+/);
    const c = parts[0];
    const arg = parts.slice(1).join(' ');

    if(state.mode==='select'){
      if(c==='classe' && CLASSES.some(cl=>cl.key===arg)) chooseClass(arg);
      else log('Selecione um operativo usando os chips ou digite: classe runner | classe chrome | classe magus','warn');
      return;
    }
    if(state.gameOver || state.win){
      if(['reiniciar','restart','reset'].includes(c)) return resetGame();
      log('Missão encerrada. Digite reiniciar.','warn');
      return;
    }
    if(state.mode==='combat'){
      if(['attack','atacar','golpe'].includes(c)) return combatAction('attack');
      if(['hack','hackear','h'].includes(c)) return combatAction('hack');
      if(['shoot','disparar','atirar','fire'].includes(c)) return combatAction('ranged');
      if(['scan','varrer'].includes(c)) return combatAction('scan');
      if(['flee','fugir','correr'].includes(c)) return combatAction('flee');
      if(c==='use' || c==='usar') return useItem(arg);
      if(c==='status') return statusCmd();
      if(['inventory','inv','inventario','inventário'].includes(c)) return inventoryCmd();
      log('Ação inválida em combate. Use attack, hack, shoot, scan, use ou flee.','warn');
      return;
    }

    switch(c){
      case 'help': case 'ajuda': return help();
      case 'look': case 'olhar': return look();
      case 'scan': case 'varrer': return scan();
      case 'status': return statusCmd();
      case 'inventory': case 'inv': case 'inventario': case 'inventário': return inventoryCmd();
      case 'loot': case 'saquear': case 'pegar': return loot();
      case 'talk': case 'falar': return talk(arg);
      case 'subornar': case 'bribe': return bribeGuard();
      case 'move': case 'ir': case 'go': return move(arg);
      case 'norte': case 'sul': case 'leste': case 'oeste': case 'n': case 's': case 'e': case 'o': return move(c);
      case 'use': case 'usar': return useItem(arg);
      case 'usaritem': return quickUse();
      case 'hack': case 'hackear': case 'h': return hack();
      case 'rest': case 'descansar': return rest();
      case 'wait': case 'esperar': case 'passar': return waitTurn();
      case 'attack': case 'atacar': case 'shoot': case 'disparar': return log('Sem alvo agora. Combate começa por encontro ou ambiente.','warn');
      case 'buy': case 'comprar': return buy(arg);
      case 'comprarsenha': return buyVaultPassword();
      case 'loja': case 'shop': return openShop();
      case 'descer': case 'descend': return descend();
      case 'retroceder': case 'voltar': case 'recuar': case 'retreat': return retreatToSurface();
      case 'avancar': case 'avançar': case 'advance': return advanceDungeon();
      case 'extrair': case 'extract': return extract();
      case 'drop': case 'descartar': return dropItem(arg);
      case 'codex': return codexCmd();
      case 'map': case 'mapa': return mapCmd();
      case 'reiniciar': case 'restart': case 'reset': return resetGame();
      default: log('Comando desconhecido. Digite ajuda.','warn');
    }
  }

      const e = state.combat.enemy;

      const room = currentRoom();

  const DRAWER_TITLES = { status:'Status do Operativo', inv:'Inventário', map:'Mapa & Objetivos', quest:'Missão & Codex', help:'Ajuda' };
  function openDrawer(key){
    currentDrawerKey = key;
    drawerOverlay.classList.add('open');
    refreshDrawer();
  }
  function closeDrawer(){
    currentDrawerKey = null;
    drawerOverlay.classList.remove('open');
  }
  function refreshDrawer(){
    drawerTitle.textContent = DRAWER_TITLES[currentDrawerKey] || '';
    if(currentDrawerKey==='status') drawerBody.innerHTML = buildStatusHTML();
    else if(currentDrawerKey==='inv') drawerBody.innerHTML = buildInventoryHTML();
    else if(currentDrawerKey==='map') drawerBody.innerHTML = buildMapHTML();
    else if(currentDrawerKey==='quest') drawerBody.innerHTML = buildQuestHTML();
    else if(currentDrawerKey==='help') drawerBody.innerHTML = buildHelpHTML();
  }

  /* ============================ EVENTS ============================ */
  document.querySelectorAll('.menu-btn').forEach(b=>{
    b.addEventListener('click', ()=> openDrawer(b.getAttribute('data-drawer')));
  });
  drawerClose.addEventListener('click', closeDrawer);
  drawerOverlay.addEventListener('click', (e)=>{ if(e.target===drawerOverlay) closeDrawer(); });
  drawerBody.addEventListener('click', (e)=>{
    const b = e.target.closest('[data-cmd]');
    if(b) runCommand(b.getAttribute('data-cmd'));
  });

  sendBtn.addEventListener('click', ()=>{
    const v = cmdInput.value; cmdInput.value = ''; runCommand(v);
  });
  cmdInput.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){ const v = cmdInput.value; cmdInput.value=''; runCommand(v); }
  });
  window.addEventListener('keydown', (e)=>{
    if(e.key==='/' && document.activeElement!==cmdInput){ e.preventDefault(); cmdInput.focus(); }
    if(e.key==='Escape') closeDrawer();
  });
  screen.addEventListener('click', (e)=>{
    if(e.target.tagName!=='BUTTON') cmdInput.focus();
  });

  /* ============================ INIT ============================ */
  state = freshState();
  intro();
  renderAll();
  cmdInput.focus();

})();
</script>
</body>
</html>
